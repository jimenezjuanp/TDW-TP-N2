<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TDW-TP-N2</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body>
    <header>
      <span>Grandes ofertas en comederos</span>
      <span> Español</span>
      <span> ARG$</span>
      <div><img src="img/Logo.png" alt="imagen logo" /></div>
      <nav>
        <ul>
          <li class="sin-viñeta"><a href="#"><img src="img/pawprint 2.png" alt="Icono huella"> Categorías</a></li>
          <li class="sin-viñeta"><a href="#"><img src="img/pawprint 2.png" alt="Icono huella"> Pets</a></li>
          <li class="sin-viñeta"><a href="#"><img src="img/pawprint 2.png" alt="Icono huella"> Nosotros</a></li>
          <li class="sin-viñeta"><a href="#"><img src="img/pawprint 2.png" alt="Icono huella"> Contactanos</a></li>
        </ul>
      </nav>
    </header>
    <!-- imagen principal-->
    <img class="imagen-completa" src="img/bowl-and-pet-daities-on-green-background 1.png" alt="Slide principal" />
    <!-- Separador icono huella -->
    <div class="icono-destacado">
      <img src="img/pawprint 1.png" alt="Huella"/>
    </div>
    <h1>Productos Destacados</h1>
    <p class="etiquetas">Comederos <span class="separador">-</span> Accesorios <span class="separador">-</span> Comida</p>
    <!-- Productos -->
    <article class="productos">
      <span>
        <img src="img/Churrasquito.png" alt="Juguete Churrasquito"/>
        <p>Juguete Churrasquito</p>
        <p>$150</p>
      </span>
      <span><img src="img/Comedero.png" alt="Comedero para perro"/></span>
      <span><img src="img/Huesito.png" alt="Juguete Huesito"/></span>
    </article>
    <!-- Contactanos -->
    <section class="seccion-contacto">
  <h2>Contáctanos</h2>
  <form class="formulario">
    <input type="text" placeholder="Nombre y Apellido" required>
    <input type="email" placeholder="Ingresá tu correo electrónico" required>
    <input type="tel" placeholder="Teléfono" required>
    <!-- Botones Contacto -->
    <div class="contenedor-botones">
      <button type="reset" class="btn-reset">Resetear</button>
      <button type="submit" class="btn-enviar">Enviar</button>
    </div>
  </form>
</section>
  </body>
</html>
